<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Mapa Interactivo con Capas Dinámicas</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* Buscador adaptable */
        .search-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            max-width: 500px;
            margin: 0 auto;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
            background: white;
            outline: none;
        }
        
        #suggestions {
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            margin-top: 5px;
            max-height: 50vh;
            overflow-y: auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            display: none;
            box-sizing: border-box;
            z-index: 1001;
        }
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .suggestion-item:active {
            background: #e0e0e0;
        }

        /* Botón de ubicación */
        .btn-ubicacion {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-ubicacion:active {
            background: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="busqueda" class="search-box" placeholder="Buscar lugar o dirección..." autocomplete="off" oninput="buscarSugerencias(this.value)">
        <div id="suggestions"></div>
    </div>

    <button class="btn-ubicacion" onclick="centrarUbicacion()" title="Mi ubicación actual">📍</button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Omnivore para leer KML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <!-- Librería turf.js para calcular si un punto está dentro de un polígono KML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([8.6226, -70.2075], 13);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var userLat = 8.6226, userLon = -70.2075;
        var capaSeleccionada = null;
        var kmlGeoJsonData = null;

        // Estilos
        var estiloNormal = {
            color: '#3388ff',
            weight: 2,
            opacity: 0.65,
            fillColor: '#3388ff',
            fillOpacity: 0.2
        };

        var estiloResaltado = {
            color: '#ff0000',
            weight: 4,
            opacity: 1,
            fillColor: '#ff7800',
            fillOpacity: 0.5
        };

        // Cargar KML
        var urlKML = 'cuadrante_nomenclatura.kml';

        var capaKML = omnivore.kml(urlKML)
            .on('ready', function(e) {
                kmlGeoJsonData = e.target.toGeoJSON();
                
                this.eachLayer(function (layer) {
                    layer.setStyle(estiloNormal);

                    layer.on('click', function (e) {
                        resaltarCapa(layer);
                        mostrarPopupCapa(layer);
                    });
                });

                // 1. Detección y centrado automático de la ubicación al iniciar la carga
                centrarUbicacion();
            })
            .on('error', function() {
                alert("Error al cargar el archivo KML. Verifica que la ruta o el archivo sean válidos.");
            })
            .addTo(map);

        // Función para cambiar el estilo visual de la capa seleccionada
        function resaltarCapa(layerToSelect) {
            if (capaSeleccionada && capaSeleccionada !== layerToSelect) {
                if (capaSeleccionada.setStyle) {
                    capaSeleccionada.setStyle(estiloNormal);
                }
            }
            capaSeleccionada = layerToSelect;
            if (capaSeleccionada && capaSeleccionada.setStyle) {
                capaSeleccionada.setStyle(estiloResaltado);
            }
        }

        // Función para abrir el popup con la información del KML
        function mostrarPopupCapa(layer, textoPrefijo) {
            var props = layer.feature.properties;
            var contenido = `<div style="max-width: 220px;">`;
            if (textoPrefijo) {
                contenido += `<small><b>${textoPrefijo}</b></small><br>`;
            }
            contenido += `<b>${props.name || 'Zona sin nombre'}</b>`;
            if (props.description) {
                contenido += `<br>${props.description}`;
            }
            contenido += `</div>`;
            layer.bindPopup(contenido).openPopup();
        }

        // Evalúa las coordenadas dadas contra los polígonos cargados del KML
        function evaluarYResaltarPunto(lat, lon, prefijoTexto) {
            if (!kmlGeoJsonData) return;

            var punto = turf.point([parseFloat(lon), parseFloat(lat)]);
            var zonaEncontrada = null;

            capaKML.eachLayer(function(layer) {
                if (layer.feature && layer.feature.geometry) {
                    try {
                        var dentro = turf.booleanPointInPolygon(punto, layer.feature);
                        if (dentro) {
                            zonaEncontrada = layer;
                        }
                    } catch (err) {
                        // Ignorar geometrías no soportadas por booleanPointInPolygon
                    }
                }
            });

            if (zonaEncontrada) {
                resaltarCapa(zonaEncontrada);
                mostrarPopupCapa(zonaEncontrada, prefijoTexto);
            } else if (capaSeleccionada) {
                // Restablecer si la ubicación queda fuera de todas las zonas
                capaSeleccionada.setStyle(estiloNormal);
                capaSeleccionada = null;
            }
        }

        // Buscador con autocompletado
        var timeoutId;
        function buscarSugerencias(query) {
            clearTimeout(timeoutId);
            var suggestionsDiv = document.getElementById('suggestions');
            
            if (query.length < 3) {
                suggestionsDiv.style.display = 'none';
                return;
            }

            timeoutId = setTimeout(() => {
                var boxSize = 0.5;
                var viewbox = `${userLon - boxSize},${userLat + boxSize},${userLon + boxSize},${userLat - boxSize}`;
                var url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=${viewbox}&bounded=0&limit=5`;

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        suggestionsDiv.innerHTML = '';
                        if (data.length > 0) {
                            suggestionsDiv.style.display = 'block';
                            data.forEach(item => {
                                var div = document.createElement('div');
                                div.className = 'suggestion-item';
                                div.innerText = item.display_name;
                                div.onclick = function() {
                                    seleccionarLugar(item.lat, item.lon, item.display_name);
                                };
                                suggestionsDiv.appendChild(div);
                            });
                        } else {
                            suggestionsDiv.style.display = 'none';
                        }
                    });
            }, 300);
        }

        var marcadorBusqueda;
        function seleccionarLugar(lat, lon, nombre) {
            document.getElementById('busqueda').value = nombre;
            document.getElementById('suggestions').style.display = 'none';
            
            var targetLat = parseFloat(lat);
            var targetLon = parseFloat(lon);
            map.setView([targetLat, targetLon], 16);

            if (marcadorBusqueda) { map.removeLayer(marcadorBusqueda); }
            marcadorBusqueda = L.marker([targetLat, targetLon]).addTo(map).bindPopup(nombre).openPopup();

            // 2. Resaltar la zona correspondiente al lugar buscado
            evaluarYResaltarPunto(targetLat, targetLon, "Zona correspondiente:");
        }

        document.addEventListener('click', function(e) {
            if (!document.querySelector('.search-container').contains(e.target)) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        // Geolocalización
        var markerUbicacion, circuloUbicacion;
        function centrarUbicacion() {
            if (!navigator.geolocation) {
                alert("Tu dispositivo no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(function(position) {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                var accuracy = position.coords.accuracy;

                map.setView([userLat, userLon], 16);

                if (markerUbicacion) {
                    map.removeLayer(markerUbicacion);
                    map.removeLayer(circuloUbicacion);
                }

                markerUbicacion = L.marker([userLat, userLon]).addTo(map)
                    .bindPopup("<b>¡Estás aquí!</b>");

                circuloUbicacion = L.circle([userLat, userLon], { radius: accuracy }).addTo(map);

                // Resaltar la zona actual del usuario
                evaluarYResaltarPunto(userLat, userLon, "Te encuentras en:");

            }, function(error) {
                console.log("No se pudo obtener la ubicación o el permiso fue denegado.");
            }, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        }
    </script>
</body>
</html>
